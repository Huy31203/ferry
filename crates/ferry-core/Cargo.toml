[package]
name = "ferry-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sidecar-fixture"
path = "tests/support/sidecar_fixture.rs"
test = false

[dependencies]
avif-decode = { version = "3.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fast_image_resize = "6.1"
gif = "0.14"
imagequant = "4.4"
libwebp-sys = "0.9"
# No nasm_simd, so building Ferry never needs NASM. Revisit if JPEG latency matters.
mozjpeg = { version = "0.10", default-features = false }
# The same features mozjpeg already enables; named here for the decoder's error manager.
mozjpeg-sys = { version = "2.2.3", default-features = false, features = ["unwinding"] }
notify = "8.2.0"
oxipng = { version = "10.2", default-features = false, features = ["parallel"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
# Default features pull in the `image` crate, which Ferry does not use.
webp = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFArray"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGContext", "CGBitmapContext", "CGDataProvider"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
