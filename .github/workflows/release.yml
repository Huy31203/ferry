name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/binaries/ffmpeg-*
            src-tauri/binaries/licenses
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'THIRD-PARTY-NOTICES.md') }}
      - name: Build ffmpeg sidecar (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          brew install nasm pkgconf meson ninja
          bash scripts/build-ffmpeg.sh universal-apple-darwin
      - if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Build ffmpeg sidecar (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh x86_64-pc-windows-msvc
      # sE pdf-formats: rav1d (AVIF decode) builds assembly with NASM on x86_64
      - uses: ilammy/setup-nasm@v1
      - name: Build gifsicle sidecar
        shell: bash
        run: scripts/build-gifsicle.sh ${{ matrix.target }}
      - name: Fetch PDFium
        shell: bash
        run: scripts/fetch-pdfium.sh ${{ matrix.target }}
      - name: Check updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets"; exit 1
          fi
          if grep -q 'REPLACE_WITH_UPDATER_PUBLIC_KEY' src-tauri/tauri.conf.json; then
            echo "::error::Put the updater public key in src-tauri/tauri.conf.json (plugins.updater.pubkey)"; exit 1
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ferry ${{ github.ref_name }}
          releaseBody: >-
            Unsigned build. Windows: SmartScreen shows "Windows protected your PC";
            choose More info → Run anyway. macOS: right-click Ferry.app → Open the first time.
          # A draft keeps every asset (installers, latest.json) private until the publish job below.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
  updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json lists every platform, signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest
          jq -e --arg v "${GITHUB_REF_NAME#v}" '. as $m
            | ($m.version | ltrimstr("v")) == $v
            and (["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]
                 | all(. as $p | (($m.platforms[$p].signature // "") != "") and (($m.platforms[$p].url // "") != "")))' \
            manifest/latest.json

  sources:
    name: third-party sources
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Collect the corresponding source (GPL-3 section 6d)
        run: |
          bash scripts/build-gifsicle.sh x86_64-unknown-linux-gnu
          bash scripts/build-ffmpeg.sh --sources "$RUNNER_TEMP/src"
          cp -R scripts THIRD-PARTY-NOTICES.md target/gifsicle-build/gifsicle-1.98.tar.gz "$RUNNER_TEMP/src/"
          tar -cJf "ferry-${GITHUB_REF_NAME}-third-party-sources.tar.xz" -C "$RUNNER_TEMP" src
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ferry-*-third-party-sources.tar.xz --clobber

  publish:
    name: publish release
    needs: [release, updater-manifest, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only now do the installers, latest.json and the corresponding-source archive go public together.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
