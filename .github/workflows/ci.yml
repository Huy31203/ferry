name: CI

on:
  push:
    # A push filter with only tags-ignore never matches branch pushes, so branches is required.
    branches: ['**']
    # release.yml builds tags; skipping them here avoids building every installer twice.
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            exe: ''
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      # The GIF tests run the real sidecar; ci_always_has_gifsicle fails if this is unset.
      FERRY_GIFSICLE: ${{ github.workspace }}/src-tauri/binaries/gifsicle-${{ matrix.triple }}${{ matrix.exe }}
      # The video tests run the real sidecar; ci_always_has_ffmpeg fails if this is unset.
      FERRY_FFMPEG: ${{ github.workspace }}/src-tauri/binaries/ffmpeg-${{ matrix.triple }}${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/binaries/ffmpeg-*
            src-tauri/binaries/licenses
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'THIRD-PARTY-NOTICES.md') }}
      - name: Build ffmpeg sidecar (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          brew install nasm pkgconf meson ninja
          bash scripts/build-ffmpeg.sh universal-apple-darwin
      - if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Build ffmpeg sidecar (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh x86_64-pc-windows-msvc
      # sE pdf-formats: rav1d (AVIF decode) builds assembly with NASM on x86_64
      - uses: ilammy/setup-nasm@v1
      - name: Build gifsicle sidecar
        shell: bash
        run: scripts/build-gifsicle.sh ${{ matrix.triple }}
      - if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - run: cargo clippy -p ferry-core --all-targets -- -D warnings
      - run: cargo test -p ferry-core

  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  bundle:
    name: bundle (${{ matrix.name }})
    needs: [core, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/binaries/ffmpeg-*
            src-tauri/binaries/licenses
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'THIRD-PARTY-NOTICES.md') }}
      - name: Build ffmpeg sidecar (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          brew install nasm pkgconf meson ninja
          bash scripts/build-ffmpeg.sh universal-apple-darwin
      - if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Build ffmpeg sidecar (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh x86_64-pc-windows-msvc
      # sE pdf-formats: rav1d (AVIF decode) builds assembly with NASM on x86_64
      - uses: ilammy/setup-nasm@v1
      - name: Build gifsicle sidecar
        shell: bash
        run: scripts/build-gifsicle.sh ${{ matrix.target }}
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p ferry
      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Check installer size
        shell: bash
        run: |
          for f in target/${{ matrix.target }}/release/bundle/nsis/*.exe target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            echo "$f: $(du -m "$f" | cut -f1) MB"
            [ "$(du -m "$f" | cut -f1)" -le 120 ]
          done
      - name: Smoke test installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer was produced" }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Ferry\Ferry.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Ferry') -ErrorAction SilentlyContinue | Format-Table FullName
            throw "Ferry.exe not found at $exe"
          }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Ferry\gifsicle.exe'))) { throw "gifsicle sidecar missing from install" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Ferry\ffmpeg.exe'))) { throw "ffmpeg sidecar missing from install" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Ferry\licenses\ffmpeg\COPYING.GPLv3'))) { throw "ffmpeg licence missing from install" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) { throw "Ferry exited early with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Ferry installed and stayed running for 10 s"
      - name: Smoke test Explorer integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Ferry\Ferry.exe'
          $verb = 'HKCU:\Software\Classes\SystemFileAssociations\.png\shell\Ferry.Optimise\command'
          $command = (Get-ItemProperty -LiteralPath $verb).'(default)'
          if ($command -ne "`"$exe`" --optimise `"%1`"") { throw "unexpected verb command: $command" }
          $progids = Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\.png\OpenWithProgids'
          if ($null -eq $progids.'Ferry.File') { throw 'Ferry is not under Open with for .png' }
          $default = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\.png' -ErrorAction SilentlyContinue).'(default)'
          if ($default -eq 'Ferry.File') { throw 'Ferry made itself the default app for .png' }
          Add-Type -AssemblyName System.Drawing
          function New-TestPng([string]$path) {
            $bmp = New-Object System.Drawing.Bitmap 256, 192
            for ($x = 0; $x -lt 256; $x++) { for ($y = 0; $y -lt 192; $y++) {
              $bmp.SetPixel($x, $y, [System.Drawing.Color]::FromArgb(255, $x, $y, ($x * $y) % 256)) } }
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          $dir = Join-Path $env:RUNNER_TEMP 'ferry smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $cold = Join-Path $dir 'cold shot.png'
          $warm = Join-Path $dir 'warm shot.png'
          New-TestPng $cold
          New-TestPng $warm
          $coldBefore = (Get-Item -LiteralPath $cold).Length
          $warmBefore = (Get-Item -LiteralPath $warm).Length
          $proc = Start-Process -FilePath $exe -ArgumentList @('--optimise', "`"$cold`"") -PassThru
          Start-Sleep -Seconds 10
          if ((Get-Item -LiteralPath $cold).Length -ge $coldBefore) { throw 'a cold start did not optimise its file' }
          Start-Process -FilePath $exe -ArgumentList @('--optimise', "`"$warm`"") -Wait
          Start-Sleep -Seconds 8
          if ((Get-Item -LiteralPath $warm).Length -ge $warmBefore) { throw 'a second launch did not hand its file over' }
          if ($proc.HasExited) { throw 'the first Ferry exited' }
          Stop-Process -Id $proc.Id -Force
          Start-Process -FilePath (Join-Path $env:LOCALAPPDATA 'Ferry\uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $verb); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $verb) { throw 'uninstall left the Explorer verb behind' }
          Write-Host 'Explorer verb, Open with and both launch paths work'
      - name: Upload installer
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ferry-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 90
