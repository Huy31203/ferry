# cargo-about configuration: licence notices for the Rust crates linked into Ferry.
# The release workflow runs: cargo about generate -c about.toml about.hbs
# Accepted licences are the ones present in Cargo.lock (collected with `cargo metadata`).
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "IJG",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
# ring's licence file is not a plain SPDX text.
workarounds = ["ring"]
